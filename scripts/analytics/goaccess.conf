# GoAccess config for SvátekTracker's nginx access log (served behind Traefik).
#
# The log line ends with the real client IP as X-Forwarded-For, e.g.:
#   10.0.1.6 - - [26/Jun/2026:03:41:20 +0000] "GET /svatektracker/ HTTP/1.1" 200 15592 "-" "UA…" "203.0.113.7"
# The first field ($remote_addr) is only the Traefik proxy, so we ignore it and
# map %h (the visitor IP GoAccess counts) to the trailing XFF field instead.
# Assumes a single proxy hop (Traefik) → exactly one IP in XFF. If a CDN or a
# second proxy is ever put in front, XFF becomes "client, proxy…" and this must
# switch to nginx real_ip ($remote_addr) rather than the raw header's last field.
log-format %^ %^ %^ [%d:%t %^] "%r" %s %b "%R" "%u" "%h"
date-format %d/%b/%Y
time-format %H:%M:%S

# Treat each macOS/Sparkle build as a real OS, drop bot noise.
ignore-crawlers true
real-os true
html-report-title SvátekTracker analytics
